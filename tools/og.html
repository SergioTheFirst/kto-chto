<!doctype html>
<!-- Источник картинки для превью ссылок (site/static/og.png): python tools/shots.py og -->
<html lang="ru">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: "Protokol Serif"; src: url("../site/static/fonts/protokol-serif-bold.woff2") format("woff2"); font-weight: 700; }
  html, body { margin: 0; width: 1200px; height: 630px; }
  body { background: #f4f1e8; color: #1b1a17; font-family: "Segoe UI", system-ui, sans-serif; display: flex; }
  .card { margin: 64px 72px; display: flex; flex-direction: column; justify-content: space-between; width: 100%; }
  .brand { font: 700 40px/1 "Protokol Serif", Georgia, serif; }
  .brand span { color: #23418f; margin-right: 10px; }

  p { font-size: 30px; color: #5b574e; margin: 0; }
  mark { background: linear-gradient(transparent 14%, #ffe680 14%, #ffe680 86%, transparent 86%); color: inherit; padding: 0 4px; }
</style>
</head>
<body>
  <div class="card">
    <div class="brand"><span>§</span>Кто-что</div>
    <h1>Кто что <mark>пообещал</mark> в&nbsp;ваших звонках</h1>
    <p>Протокол договорённостей из записей. На вашем компьютере, без подписки.</p>
  </div>

</html>
